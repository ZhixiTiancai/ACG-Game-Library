name: Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: source/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r source/requirements.txt
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s source -v
      - name: Build portable app
        run: python -m PyInstaller --noconfirm --distpath dist --workpath build "source/ACG Game Library.spec"
      - name: Package clean release
        run: python source/release_tools.py --app-dir "dist/ACG Game Library" --output release --tag "${{ github.ref_name }}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG --json id 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release already exists; existing assets retained."
            exit 0
          }
          $assets = Get-ChildItem -LiteralPath release -File | ForEach-Object { $_.FullName }
          gh release create $env:RELEASE_TAG @assets --title "ACG Game Library $env:RELEASE_TAG" --notes-file RELEASE_NOTES.md --verify-tag
